<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Untuk Kamu, Semangatku ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #ff4d6d;
            --primary-light: #ffb3c1;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background: #000;
            font-family: 'Nunito Sans', sans-serif; 
            color: white;
            overflow: hidden;
            min-height: 100vh;
        }

        #bg-image {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        #bg-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.5;
            filter: brightness(0.4) blur(3px);
            transform: scale(1.15);
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), filter 2s ease;
        }

        #bg-image img.zoom-out {
            transform: scale(1.0);
            filter: brightness(0.35) blur(2px);
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .scene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
        }

        .envelope-stage {
            position: relative;
            width: 320px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 200px;
            
            transition: transform 0.4s ease;
            transform-style: preserve-3d;
        }

        .envelope-wrapper:hover { transform: scale(1.05); }

        .envelope-wrapper.pulse { animation: envelopePulse 2s infinite; }
        @keyframes envelopePulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.3)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 40px rgba(255, 77, 109, 0.6)); }
        }

        .envelope-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.5));
            overflow: visible;
        }

        .envelope-flap-group {
            transform-origin: 140px 60px;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .envelope-open .envelope-flap-group {
            transform: rotateX(-180deg);
        }

        .letter {
            position: absolute;
            width: 240px;
            height: 160px;
            background: linear-gradient(145deg, #fff5f7, #ffe4ec);
            border-radius: 8px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateY(25px);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            overflow: hidden;
            z-index: 2000;
        }

        .letter::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
        }

        .envelope-open .letter {
            opacity: 1;
            transform: translate(-50%, -50%) translateY(-110px);
            pointer-events: all;
            
            z-index: 15;
        }

        .letter-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #c9184a;
            text-align: center;
            padding: 20px;
        }

        .letter-hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 8px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .tap-hint {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
            animation: floatHint 2s ease-in-out infinite;
        }
        @keyframes floatHint {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
            max-width: 480px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,77,109,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .memory-card {
            aspect-ratio: 1;
            perspective: 1000px;
            
        }

        .memory-card-inner {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .memory-card.flipped .memory-card-inner {
            transform: rotateY(180deg);
        }

        .memory-card.matched .memory-card-inner {
            animation: matchedPop 0.5s ease;
        }
        @keyframes matchedPop {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-front {
            background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .card-front::after {
            content: '❤';
            font-size: 1.2rem;
            opacity: 0.3;
            color: var(--primary);
        }

        .memory-card:hover .card-front {
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card-back {
            background: linear-gradient(145deg, var(--primary), #c9184a);
            transform: rotateY(180deg);
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        .message-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .photo-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(255, 77, 109, 0.3), 0 10px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            position: relative;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: scale(0.8);
            background: white;
        }

        .photo-frame.visible {
            opacity: 1;
            transform: scale(1);
        }

        .photo-frame img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .photo-frame:hover img { transform: scale(1.1); }

        .photo-frame::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .text-bubble {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid rgba(255,255,255,0.15);
        }

        #kalimat {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.7;
            color: #fff;
            text-align: center;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--primary-light);
            margin-left: 4px;
            animation: cursorBlink 0.8s infinite;
            vertical-align: text-bottom;
            border-radius: 2px;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .reply-btn {
            background: linear-gradient(135deg, var(--primary), #c9184a);
            color: white;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 77, 109, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(20px);
        }

        .reply-btn.visible {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .reply-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 77, 109, 0.6);
        }

        .progress-container {
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
        }

        .progress-track {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            transform-origin: left;
            animation: shrinkBar 7s linear forwards;
        }
        @keyframes shrinkBar { to { transform: scaleX(0); } }

        .loading-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

        .footer {
            position: fixed;
            bottom: 16px;
            left: 0; right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            z-index: 100;
            pointer-events: none;
        }

        .floating-heart {
            position: fixed;
            color: var(--primary);
            pointer-events: none;
            z-index: 5;
            animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.2) rotate(360deg); }
        }

        .transition-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .transition-overlay.active { opacity: 1; }

        @media (max-width: 480px) {
            .envelope-stage { width: 260px; height: 240px; }
            .envelope-wrapper { width: 220px; height: 160px; }
            .letter { width: 190px; height: 130px; transform: translate(-50%, -50%) translateY(20px); }
            .envelope-open .letter { transform: translate(-50%, -50%) translateY(-90px); }
            .photo-frame { width: 160px; height: 160px; }
            .game-grid { gap: 8px; }
            .text-bubble { padding: 18px 20px; }
            #kalimat { font-size: 1rem; }
        }
    </style>

<body>

    <audio src="https://ik.imagekit.io/srfdvvkga/A%20Thousand%20Years.mp3" id="bg-music" loop></audio>

    <div id="bg-image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTjd1UGFY7PwNpET-zKjmCp6RpZ6W6jgmf4vmT1cD1aQ&s=10" id="bg-img" alt="bg"/>
    </div>

    <canvas id="particle-canvas"></canvas>


    <div class="transition-overlay" id="transition-overlay"></div>

<div class="scene active" id="scene-envelope">
        <div class="envelope-stage">
            <div class="envelope-wrapper pulse" id="envelope-wrapper" onclick="handleEnvelopeClick()">

                <svg class="envelope-svg" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" style="position:absolute; top:0; left:0; z-index:20;">
                    <defs>
                        <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c9184a"/>
                            <stop offset="100%" style="stop-color:#ff4d6d"/>
                        </linearGradient>
                        <linearGradient id="envGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#a0133b"/>
                            <stop offset="100%" style="stop-color:#d63356"/>
                        </linearGradient>
                        <linearGradient id="flapBack" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#8f0f32"/>
                            <stop offset="100%" style="stop-color:#b01a3d"/>
                        </linearGradient>
                    </defs>

                    
                    <rect x="10" y="60" width="260" height="130" rx="8" fill="url(#envGradDark)"/>
                    <rect x="15" y="65" width="250" height="120" rx="6" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>

                  
                    <polygon points="10,60 140,130 270,60" fill="#7a0c29" opacity="0.5"/>

                    
                    <rect x="10" y="100" width="260" height="90" rx="8" fill="url(#envGrad)"/>
                    <polygon points="10,100 80,145 10,190" fill="rgba(0,0,0,0.12)"/>
                    <polygon points="270,100 200,145 270,190" fill="rgba(0,0,0,0.12)"/>
                    <polygon points="10,190 140,130 270,190" fill="#d63356"/>

                    <g class="envelope-flap-group" id="envelope-flap-group">
                        <polygon points="10,60 140,150 270,60" fill="url(#envGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                        
                    </g>

                    
                    <circle cx="140" cy="105" r="16" fill="#fff5f7" opacity="0.95"/>
                    <text x="140" y="112" text-anchor="middle" font-size="18" fill="#ff4d6d" style="pointer-events:none;">❤</text>
                </svg>

               <div class="letter" id="letter" onclick="openLetter(event)">
                    <div class="letter-text">Untuk Kamu 💌</div>
                    <div class="letter-hint">Klik untuk membuka</div>
                </div>

            </div>
            <div class="tap-hint" id="envelope-hint">Klik amplop untuk membuka</div>
        </div>
    </div>
    <div class="scene" id="scene-loading">
        <div class="glass-panel">
            <div class="loading-text">Sabar ya<span class="loading-dots"></span></div>
            <div class="progress-container">
                <div class="progress-track"><div class="progress-fill"></div></div>
            </div>
        </div>
    </div>

    <div class="scene" id="scene-game">
        <div class="glass-panel">
            <div class="game-title">Cari Pasangan Emoji</div>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 4px;">Temukan semua pasangan untuk melanjutkan</p>
            <div class="game-grid" id="game-grid"></div>
        </div>
    </div>

    <div class="scene" id="scene-message">
        <div class="message-container">
            <div class="photo-frame" id="photo-frame">
                <img src="" alt="Foto" id="current-photo"/>
            </div>
            <div class="text-bubble">
                <p id="kalimat"><span class="cursor"></span></p>
            </div>
            <a href="#" class="reply-btn" id="reply-btn" onclick="balas()">
                <span>💌 Balas Pesan</span>
            </a>
        </div>
    </div>

    <div class="footer">dibuat dengan 🤍 oleh Farel Alfareza</div>

    <script>
        const contentData = [
            { text: "Hai sayangku...", photo: "https://feeldreams.github.io/pandaputih.gif" },
            { text: "Aku tau belakangan ini duniamu terasa berat.", photo: "https://feeldreams.github.io/pandapanah.gif" },
            { text: "Banyak hal yang menguras pikiran dan tenagamu.", photo: "https://feeldreams.github.io/pandapanah.gif" },
            { text: "Tapi tolong ingat ini baik-baik...", photo: "https://feeldreams.github.io/pandapanah.gif" },
            { text: "Kamu sudah melakukan yang terbaik, sungguh.", photo: "https://raw.githubusercontent.com/amirisback/photo-panda-bear-dudu-bubu/refs/heads/master/bear-panda/bear-blink-2.gif" },
            { text: "Gak apa-apa kalau mau istirahat sebentar.", photo: "https://raw.githubusercontent.com/amirisback/photo-panda-bear-dudu-bubu/refs/heads/master/bear-panda/bear-blink-2.gif" },
            { text: "Gak harus selalu terlihat kuat di depanku.", photo: "https://raw.githubusercontent.com/amirisback/photo-panda-bear-dudu-bubu/refs/heads/master/bear-panda/bear-chick.gif" },
            { text: "Nangis aja kalau itu buat kamu tenang.", photo: "https://raw.githubusercontent.com/amirisback/photo-panda-bear-dudu-bubu/refs/heads/master/bear-panda/bear-chick.gif" },
            { text: "Aku akan selalu ada di sini buat dengerin kamu.", photo: "https://raw.githubusercontent.com/amirisback/photo-panda-bear-dudu-bubu/refs/heads/master/bear-panda/bear-chick.gif" },
            { text: "Masalahmu adalah masalahku juga.", photo: "https://media.tenor.com/1eDQDtQmfsoAAAAj/bear-panda.gif" },
            { text: "Kita hadapi ini pelan-pelan, satu per satu.", photo: "https://media.tenor.com/1eDQDtQmfsoAAAAj/bear-panda.gif" },
            { text: "Jangan pernah merasa sendirian ya?", photo: "https://media.tenor.com/1eDQDtQmfsoAAAAj/bear-panda.gif" },
            { text: "Aku bangga banget punya kamu.", photo: "https://feeldreams.github.io/pusn2.gif" },
            { text: "Kamu itu kuat, hebat, dan berharga.", photo: "https://feeldreams.github.io/pandamuter.gif" },
            { text: "I love you more than you know. ❤️", photo: "https://feeldreams.github.io/emawh.gif" }
        ];

        
        const audio = document.getElementById('bg-music');
        let audioStarted = false;

        function startAudio() {
            if (!audioStarted) {
                audio.volume = 0.6;
                audio.play().catch(() => {});
                audioStarted = true;
            }
        }

        
        const bgImg = document.getElementById('bg-img');
        let bgZoomState = false;

        function triggerBgZoom() {
            
            if (bgZoomState) {
                bgImg.classList.remove('zoom-out');
            } else {
                bgImg.classList.add('zoom-out');
            }
            bgZoomState = !bgZoomState;
        }

      
        function showScene(id) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function transitionTo(sceneId, delay = 800) {
            const overlay = document.getElementById('transition-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                showScene(sceneId);
                setTimeout(() => overlay.classList.remove('active'), 100);
            }, delay);
        }

        
        let envelopeState = 'closed';

        function handleEnvelopeClick() {
            startAudio();
            if (envelopeState === 'closed') {
                envelopeState = 'open';
                const wrapper = document.getElementById('envelope-wrapper');
                wrapper.classList.remove('pulse');
                wrapper.classList.add('envelope-open');
                document.getElementById('envelope-hint').textContent = 'Klik suratnya ya';

                const rect = wrapper.getBoundingClientRect();
                burstParticles(rect.left + rect.width/2, rect.top + rect.height/2, 25, '#ff4d6d');
            }
        }

        function openLetter(e) {
            e.stopPropagation();
            if (envelopeState === 'open') {
                envelopeState = 'letter-out';
                const letter = document.getElementById('letter');
                letter.style.transform = 'translate(-50%, -50%) translateY(-250px) scale(0.4)';
                letter.style.opacity = '0';

                const wrapper = document.getElementById('envelope-wrapper');
                const rect = wrapper.getBoundingClientRect();
                burstParticles(rect.left + rect.width/2, rect.top + rect.height/2, 35, '#ffb3c1');

                setTimeout(() => {
                    transitionTo('scene-loading');
                    setTimeout(() => {
                        transitionTo('scene-game');
                        initGame();
                    }, 7000);
                }, 800);
            }
        }

        // ===== MEMORY GAME =====
        const emojis = ['😇','💐','🤍','🌷','⭐','🌸','😇','💐','🤍','🌷','⭐','🌸'];
        let flippedCards = [];
        let matchedCount = 0;
        let canFlip = true;

        function initGame() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            const shuffled = [...emojis].sort(() => Math.random() - 0.5);

            shuffled.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <div class="memory-card-inner">
                        <div class="card-face card-front"></div>
                        <div class="card-face card-back">${emoji}</div>
                    </div>
                `;
                card.addEventListener('click', () => flipCard(card));

                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, i * 80);

                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            flippedCards.push(card);
            if (flippedCards.length === 2) {
                canFlip = false;
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.emoji === c2.dataset.emoji) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedCount += 2;

                const rect = c1.getBoundingClientRect();
                burstParticles(rect.left + rect.width/2, rect.top + rect.height/2, 10, '#ff4d6d');

                if (matchedCount === emojis.length) {
                    setTimeout(() => {
                        transitionTo('scene-message');
                        setTimeout(startMessageAnimation, 600);
                    }, 600);
                }
                canFlip = true;
            } else {
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    canFlip = true;
                }, 400);
            }
            flippedCards = [];
        }

        
        let currentIndex = 0;
        const kalimatEl = document.getElementById('kalimat');
        const photoFrame = document.getElementById('photo-frame');
        const currentPhoto = document.getElementById('current-photo');
        const replyBtn = document.getElementById('reply-btn');

        function startMessageAnimation() {
            currentIndex = 0;
            showMessageItem(0);
        }

        function showMessageItem(index) {
            if (index >= contentData.length) {
                replyBtn.classList.add('visible');
                startFloatingHearts();
                startFireworks();
                return;
            }

            const item = contentData[index];

            
            triggerBgZoom();

            
            photoFrame.classList.remove('visible');
            setTimeout(() => {
                currentPhoto.src = item.photo;
                currentPhoto.onload = () => photoFrame.classList.add('visible');
                if (currentPhoto.complete) photoFrame.classList.add('visible');
            }, 300);

          
            typeText(item.text, () => {
                setTimeout(() => {
                    kalimatEl.style.transition = 'opacity 0.5s ease';
                    kalimatEl.style.opacity = '0';

                    setTimeout(() => {
                        kalimatEl.style.opacity = '1';
                        showMessageItem(index + 1);
                    }, 500);
                }, 2000);
            });
        }

        function typeText(text, callback) {
            kalimatEl.innerHTML = '<span class="cursor"></span>';
            let i = 0;
            const speed = 55;

            function type() {
                if (i < text.length) {
                    kalimatEl.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                    setTimeout(type, speed + Math.random() * 30);
                } else {
                    kalimatEl.innerHTML = text + '<span class="cursor"></span>';
                    if (callback) setTimeout(callback, 800);
                }
            }
            type();
        }

        function balas() {
            window.location.href = "https://wa.me/?text=Makasih+ya+Farel+udah+selalu+ada+buat+aku...+Sayang+kamu+banget+%E2%9D%A4%EF%B8%8F";
        }

    
        function startFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('i');
                heart.className = 'fa-solid fa-heart floating-heart';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.bottom = '-30px';
                heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heart.style.opacity = Math.random() * 0.5 + 0.3;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, 400);
        }

      
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let fireworks = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color, speed, angle, life, size) {
                this.x = x; this.y = y; this.color = color;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = life; this.maxLife = life;
                this.size = size;
                this.gravity = 0.08; this.drag = 0.98;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= this.drag; this.vy *= this.drag;
                this.life--; this.size *= 0.97;
            }
            draw() {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * canvas.height * 0.4 + 50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -(Math.random() * 3 + 6);
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, 70%)`;
                this.exploded = false;
                this.trail = [];
            }
            update() {
                if (!this.exploded) {
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 10) this.trail.shift();
                    this.x += this.vx; this.y += this.vy;
                    this.vy += 0.15;
                    if (this.vy >= 0 || this.y <= this.targetY) this.explode();
                }
            }
            explode() {
                this.exploded = true;
                const count = Math.random() * 30 + 40;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                    const speed = Math.random() * 4 + 2;
                    const color = `hsl(${Math.random() * 60 + 320}, 100%, ${Math.random() * 30 + 60}%)`;
                    particles.push(new Particle(this.x, this.y, color, speed, angle, Math.random() * 60 + 40, Math.random() * 3 + 1));
                }
            }
            draw() {
                if (!this.exploded) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    this.trail.forEach((t, i) => {
                        ctx.globalAlpha = i / this.trail.length * 0.5;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.globalAlpha = 1;
                }
            }
        }

        function burstParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push(new Particle(x, y, color, speed, angle, Math.random() * 40 + 30, Math.random() * 3 + 1));
            }
        }

        function startFireworks() {
            setInterval(() => {
                if (Math.random() > 0.6) fireworks.push(new Firework());
            }, 1500);
        }

        function spawnAmbient() {
            if (Math.random() > 0.85) {
                const x = Math.random() * canvas.width;
                const y = canvas.height + 10;
                const color = `hsla(${Math.random() * 40 + 320}, 80%, 70%, 0.6)`;
                particles.push(new Particle(x, y, color, Math.random() * 1 + 0.5, -Math.PI/2 + (Math.random()-0.5)*0.5, Math.random() * 100 + 80, Math.random() * 2));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spawnAmbient();
            fireworks.forEach((fw, i) => {
                fw.update(); fw.draw();
                if (fw.exploded) fireworks.splice(i, 1);
            });
            particles.forEach((p, i) => {
                p.update(); p.draw();
                if (p.life <= 0 || p.size < 0.1) particles.splice(i, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        const preloadImg = new Image();
        preloadImg.src = contentData[0].photo;
    </script>
</body>
</html>
